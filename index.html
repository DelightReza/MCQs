<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; media-src 'self' https: http:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self';">
  <title>Universal Quiz Platform</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="logo-wrap">
        <span class="logo-icon">✨</span>
        <h1>Universal Quiz Platform</h1>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <div id="ariaStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <main id="dashboard" class="view active">
      <div class="dashboard-grid">
        <div class="col-left">
          <section class="panel">
            <h2>Question Banks</h2>
            <div class="controls-grid">
              <input id="bankSearch" type="search" placeholder="Search banks..." />
            </div>
            <div id="bankList" class="bank-list"></div>
          </section>
        </div>

        <div class="col-right">
          <section class="panel">
            <h2>Quiz Setup</h2>
            <div class="setup-grid">
              <div class="selected-bank-status">
                <span>Selected Bank:</span>
                <strong id="selectedBankLabel">None Selected</strong>
              </div>
              <label>Number of Questions
                <select id="questionCount">
                  <option>10</option><option>20</option><option>25</option><option>40</option>
                  <option>50</option><option>75</option><option>100</option><option>200</option>
                  <option>500</option><option value="all">All Questions</option>
                </select>
              </label>

              <div class="mode-selection">
                <span class="mode-label">Mode:</span>
                <div class="radio-group">
                  <label><input type="radio" name="quizMode" id="examMode" checked /> Exam Mode</label>
                  <label><input type="radio" name="quizMode" id="practiceMode" /> Practice Mode</label>
                </div>
              </div>

              <div class="checkbox-options">
                <label><input type="checkbox" id="shuffleQuestions" checked /> Shuffle Questions</label>
                <label><input type="checkbox" id="shuffleOptions" checked /> Shuffle Options</label>
                <label><input type="checkbox" id="timedMode" checked /> Timed Mode</label>
                <label><input type="checkbox" id="fullscreenMode" /> Fullscreen Mode</label>
                <label><input type="checkbox" id="bookmarkedOnly" /> Bookmarked Only</label>
              </div>
            </div>
            <div class="actions-row">
              <button id="startQuizBtn" disabled>Start Quiz</button>
              <button id="resumeBtn" class="hidden">Resume Previous Quiz</button>
              <button id="clearResumeBtn" class="secondary hidden danger-text">Delete Saved Session</button>
              <button id="manageBookmarksBtn" class="secondary">Review Bookmarks</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <main id="quizView" class="view">
      <section class="quiz-header">
        <div><strong id="quizTitle"></strong></div>
        <div class="quiz-counter">Question <span id="currentQ">1</span>/<span id="totalQ">0</span></div>
        <div id="timerWrap">⏱ <span id="timer">00:00</span></div>
      </section>
      <div class="progress-wrap">
        <progress id="progressBar" class="progress-bar" value="0" max="100"></progress>
      </div>

      <section id="questionContainer" class="question-container"></section>

      <section class="quiz-actions">
        <button id="prevBtn">Previous</button>
        <button id="markBtn">Mark for Review</button>
        <button id="bookmarkBtn">Bookmark</button>
        <button id="nextBtn">Next</button>
        <button id="submitBtn">Submit</button>
        <button id="quitBtn" class="secondary">Exit to Home</button>
      </section>

      <section class="panel">
        <h3>Question Timeline</h3>
        <div class="palette-wrapper">
          <button id="paletteScrollLeft" class="palette-scroll-btn" aria-label="Scroll left">‹</button>
          <div class="palette-container">
            <div id="palette" class="palette"></div>
          </div>
          <button id="paletteScrollRight" class="palette-scroll-btn" aria-label="Scroll right">›</button>
        </div>
      </section>
    </main>

    <main id="resultsView" class="view">
      <section class="panel">
        <h2>Result</h2>
        <div id="resultSummary" class="result-summary"></div>
        <div class="actions-row">
          <button id="reviewBtn">Review Answers</button>
          <button id="downloadCsvBtn" class="secondary">Export CSV</button>
          <button id="downloadJsonBtn" class="secondary">Export JSON</button>
          <button id="printBtn" class="secondary">Print / PDF</button>
          <button id="backHomeBtn">Back to Dashboard</button>
        </div>
      </section>
    </main>

    <main id="reviewView" class="view">
      <section class="panel">
        <h2>Review Mode</h2>
        <div class="controls-grid">
          <select id="reviewFilter">
            <option value="all">Review All</option>
            <option value="incorrect">Review Incorrect</option>
            <option value="unanswered">Review Unanswered</option>
            <option value="marked">Review Marked</option>
            <option value="correct">Review Correct</option>
          </select>
          <input id="reviewSearch" type="search" placeholder="Search question text..." />
          <button id="exportBookmarksBtn" class="secondary">Export Bookmarks JSON</button>
          <button id="reviewBackBtn">Back</button>
        </div>
        <div id="reviewList"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
